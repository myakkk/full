name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Кодты алу
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Python орнату
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Кітапханаларды орнату (Flet, Supabase, т.б.)
      - name: Install dependencies
        run: |
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Flutter ортасын дайындау (APK жинау үшін керек)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # 5. APK жинау (Ең маңызды қадам)
      # --product "№63 Қ.Сатбаев" деген жерде телефондағы аты тұр
      - name: Flet Build APK
        run: |
          flet build apk --project "SatbayevENT" --product "№63 Қ.Сатбаев" --org "com.satbayev.ent" -v

      # 6. Дайын APK-ны жүктеп алуға дайындау
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Satbayev-Mektep-APK
          path: build/apk/app-release.apk
